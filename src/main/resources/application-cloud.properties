# === Profilo "cloud": chiavi JWT lette da AWS Parameter Store ===
# Attivato con SPRING_PROFILES_ACTIVE=cloud. Richiede credenziali AWS valide
# (region/credential provider di default) e i parametri sotto /crewhive/key/
# (jwt/privateKey, jwt/publicKey).
spring.config.import=aws-parameterstore:/crewhive/key/
