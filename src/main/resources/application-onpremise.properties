# === Profilo "onpremise": chiavi JWT lette da variabili d'ambiente ===
# Attivato con SPRING_PROFILES_ACTIVE=onpremise. Valorizza JWT_PUBLIC_KEY/JWT_PRIVATE_KEY
# (es. nel file .env, caricato da docker-compose.yml via env_file) con il corpo base64
# delle chiavi RSA (con o senza header -----BEGIN/END-----, vengono comunque ripuliti).
jwt.publicKey=${JWT_PUBLIC_KEY}
jwt.privateKey=${JWT_PRIVATE_KEY}
